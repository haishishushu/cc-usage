name: 发布桌面安装包

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: desktop-release-${{ github.ref }}
  # 每次 main 提交都产生独立版本；不中途取消已开始的发行。
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare-continuous-release:
    name: 计算独立发行版本
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next-version.outputs.version }}
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 计算下一个独立发行版本号
        id: next-version
        shell: bash
        run: |
          set -euo pipefail
          git tag --list 'v*' > "$RUNNER_TEMP/version-tags.txt"
          VERSION=$(node scripts/next-release-version.mjs "$RUNNER_TEMP/version-tags.txt")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "下一个独立发行版本号：$VERSION（标签 v$VERSION）"

  publish:
    needs: prepare-continuous-release
    if: always() && (needs.prepare-continuous-release.result == 'success' || needs.prepare-continuous-release.result == 'skipped')
    name: 构建 ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            assetNamePattern: CC-Usage-v[version]-Windows-x86_64-Setup[ext]
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
            assetNamePattern: CC-Usage-v[version]-macOS-arm64[ext]
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
            assetNamePattern: CC-Usage-v[version]-macOS-x86_64[ext]
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
            assetNamePattern: CC-Usage-v[version]-Linux-x86_64[ext]

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            frontend/pnpm-lock.yaml

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 缓存 Rust 构建
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: 安装 Linux 构建依赖
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: 安装项目依赖
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir frontend install --frozen-lockfile

      # 主分支使用 prepare job 从旧资源与独立标签推算的统一版本号；
      # 打 tag 的正式版仍使用 tauri.conf.json 中的版本号。
      - name: 生成本次发行版本号
        if: github.ref_type != 'tag'
        env:
          CONTINUOUS_VERSION: ${{ needs.prepare-continuous-release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const path = "backend/tauri.conf.json";
            const conf = JSON.parse(fs.readFileSync(path, "utf8"));
            const version = process.env.CONTINUOUS_VERSION;
            if (!/^\d+\.\d+\.\d+$/.test(version ?? "")) throw new Error("发行版本号缺失或无效");
            conf.version = version;
            fs.writeFileSync(path, `${JSON.stringify(conf, null, 2)}\n`);
            // Cargo.toml 与 conf 保持一致，避免两处版本号各说各话
            const cargo = "backend/Cargo.toml";
            const text = fs.readFileSync(cargo, "utf8");
            fs.writeFileSync(cargo, text.replace(/^version = ".*"$/m, `version = "${version}"`));
            console.log(`发行版本号：${version}`);
          '

      - name: 校验正式标签与应用版本一致
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const version = JSON.parse(fs.readFileSync("backend/tauri.conf.json", "utf8")).version;
            if (process.env.TAG !== `v${version}`) throw new Error(`标签 ${process.env.TAG} 与应用版本 ${version} 不一致`);
          '

      - name: 构建并发布安装包
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: CC Usage v__VERSION__
          releaseBody: |
            请在下方选择适合当前系统的安装包。

            本发行版只包含 v__VERSION__ 的安装包。请选择与操作系统和处理器架构相符的文件。
          releaseDraft: false
          prerelease: false
          assetNamePattern: ${{ matrix.assetNamePattern }}
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

  publish-manifest:
    needs: [prepare-continuous-release, publish]
    name: 发布更新清单到 Pages
    runs-on: ubuntu-latest
    # 全平台构建完 latest.json 才是完整的；任一平台失败就不发布，
    # 避免把缺平台的清单推上去让那些用户收到半截更新。
    if: always() && needs.publish.result == 'success'
    # 用 Pages 的 Actions 部署模式：不建分支、不往仓库提交任何东西，
    # 与 cc-usage-website 仓库同一套模式。
    permissions:
      # contents 需要写权限：下面要验证发行版并标记最新版本
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: 检出校验脚本
        uses: actions/checkout@v4

      - name: 取回本次发布的 latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', needs.prepare-continuous-release.outputs.version) }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern latest.json \
            --dir site
          echo "发布的清单版本：$(node -p "require('./site/latest.json').version")"
          echo "覆盖平台：$(node -p "Object.keys(require('./site/latest.json').platforms).join(', ')")"

      - name: 校验安装包与更新清单的版本
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', needs.prepare-continuous-release.outputs.version) }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets > "$RUNNER_TEMP/release.json"
          VERSION=$(node -p "require('./site/latest.json').version")
          node scripts/verify-release.mjs "$VERSION" "$TAG" site/latest.json "$RUNNER_TEMP/release.json"

      - name: 上传 Pages 制品
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: 部署到 Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: 标记本版为最新发行版
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', needs.prepare-continuous-release.outputs.version) }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./site/latest.json').version")
          gh release edit "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "CC Usage v${VERSION}" \
            --prerelease=false \
            --latest
          echo "已将 $TAG 标记为最新发行版：CC Usage v${VERSION}"
