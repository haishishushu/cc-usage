name: 发布桌面安装包

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prepare-continuous-release:
    name: 更新持续构建标签
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 将 continuous 标签指向本次提交
        shell: bash
        run: |
          git tag --force continuous "${GITHUB_SHA}"
          git push --force origin refs/tags/continuous

  publish:
    needs: prepare-continuous-release
    if: always() && (needs.prepare-continuous-release.result == 'success' || needs.prepare-continuous-release.result == 'skipped')
    name: 构建 ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            assetNamePattern: CC-Usage-v[version]-Windows-x86_64-Setup[ext]
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
            assetNamePattern: CC-Usage-v[version]-macOS-arm64[ext]
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
            assetNamePattern: CC-Usage-v[version]-macOS-x86_64[ext]
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
            assetNamePattern: CC-Usage-v[version]-Linux-x86_64[ext]

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            frontend/pnpm-lock.yaml

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 缓存 Rust 构建
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: 安装 Linux 构建依赖
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: 安装项目依赖
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir frontend install --frozen-lockfile

      # 持续构建版的补丁号取工作流运行号，保证每次发布版本号都严格递增；
      # 否则 latest.json 永远是 conf 里写死的版本，已安装的用户永远收不到更新。
      # 打 tag 的正式版不改写，用 tauri.conf.json 里的版本号。
      - name: 生成持续构建版本号
        if: github.ref_type != 'tag'
        shell: bash
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const path = "backend/tauri.conf.json";
            const conf = JSON.parse(fs.readFileSync(path, "utf8"));
            const [major, minor] = conf.version.split(".");
            const version = `${major}.${minor}.${process.env.GITHUB_RUN_NUMBER}`;
            conf.version = version;
            fs.writeFileSync(path, `${JSON.stringify(conf, null, 2)}\n`);
            // Cargo.toml 与 conf 保持一致，避免两处版本号各说各话
            const cargo = "backend/Cargo.toml";
            const text = fs.readFileSync(cargo, "utf8");
            fs.writeFileSync(cargo, text.replace(/^version = ".*"$/m, `version = "${version}"`));
            console.log(`持续构建版本号：${version}`);
          '

      - name: 构建并发布安装包
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_type == 'tag' && 'v__VERSION__' || 'continuous' }}
          releaseName: CC Usage v__VERSION__
          releaseBody: |
            请在下方选择适合当前系统的安装包。

            `continuous` 为 main 分支每次提交后自动更新的持续构建版；`v*` 标签为正式稳定版。
          releaseDraft: false
          # 持续构建版也标为正式发布：GitHub 的「最新发行版」徽章只认非预发布，
          # 标成预发布的话徽章会一直留在旧的 v* 标签上误导访客，
          # 而且回退端点 releases/latest 会跟着指向旧版本，向用户谎报「已是最新」。
          prerelease: false
          assetNamePattern: ${{ matrix.assetNamePattern }}
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

  publish-manifest:
    needs: publish
    name: 发布更新清单到 Pages
    runs-on: ubuntu-latest
    # 全平台构建完 latest.json 才是完整的；任一平台失败就不发布，
    # 避免把缺平台的清单推上去让那些用户收到半截更新。
    if: success()
    # 用 Pages 的 Actions 部署模式：不建分支、不往仓库提交任何东西，
    # 与 cc-usage-website 仓库同一套模式。
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: 取回本次发布的 latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'continuous' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern latest.json \
            --dir site
          echo "发布的清单版本：$(node -p "require('./site/latest.json').version")"
          echo "覆盖平台：$(node -p "Object.keys(require('./site/latest.json').platforms).join(', ')")"

      - name: 上传 Pages 制品
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: 部署到 Pages
        id: deploy
        uses: actions/deploy-pages@v4
