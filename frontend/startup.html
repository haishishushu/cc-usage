<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CC Usage · 启动中</title>
    <link rel="stylesheet" href="/src/startup.css" />
  </head>
  <body>
    <main class="startup" role="status" aria-live="polite">
      <div class="content">
        <!-- 徽标同款“用量胶囊”，两根用量条交替伸缩充当加载动画 -->
        <div class="mark" aria-hidden="true">
          <span class="bar"><i></i></span>
          <span class="bar"><i></i></span>
        </div>
        <h1 id="title">正在打开主面板…</h1>
        <p id="detail">正在准备本地数据</p>
        <div class="track" aria-hidden="true"><span></span></div>
      </div>
      <footer class="foot">
        <span class="brand"><img src="/favicon.svg" alt="" />CC Usage</span>
        <div class="actions" id="actions" hidden>
          <button id="quit" type="button">退出</button>
          <button id="retry" class="primary" type="button">重试</button>
        </div>
      </footer>
    </main>
    <script type="module" src="/src/startup.ts"></script>
  </body>
</html>
